[build-system]
# Required build dependencies
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Basic project metadata
name = "step_together_api"
version = "0.1.0"  # Start with 0.1.0 and increment as you release
description = "FastAPI application for Step Together"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.8"  # Adjust based on your Python version

# Main dependencies (converted from requirements.txt)
dependencies = [
    "annotated-types==0.7.0",
    "anyio==3.7.1",  # Note: Updated to match fastapi 0.115.12 compatibility
    "bcrypt==4.0.1",
    "certifi>=2025.4.26",
    "cffi==1.17.1",
    "click==8.2.0",
    "colorama==0.4.6",
    "cryptography==45.0.3",
    "dnspython==2.7.0",
    "ecdsa==0.19.1",
    "email-validator==2.2.0",
    "fastapi==0.115.12",
    "python-dotenv>=1.0.0",  # Added version for consistency
    "greenlet==3.2.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.10",
    "passlib==1.7.4",
    "pyasn1==0.4.8",
    "pycparser==2.22",
    "pydantic==2.11.4",
    "pydantic-core==2.33.2",
    "pydantic-settings==2.0.3",
    "python-jose==3.4.0",
    "python-multipart==0.0.20",
    "rsa==4.9.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.41",
    "starlette==0.46.2",  # Pinned to match fastapi 0.115.12
    "typing-extensions==4.13.2",
    "uvicorn==0.34.2"
]

# Development dependencies (extracted from your test-related packages)
[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-mock==3.14.1",
    "iniconfig==2.1.0",
    "pluggy==1.6.0",
    "packaging==25.0",
    "Pygments==2.19.1",  # Typically a dev dependency
    "PyMySQL==1.1.1",    # Database adapter (could be main or dev)
    "typing-inspection==0.4.0"
]

# Entry points (optional - for CLI commands)
[project.scripts]
# Example: start-app = "app.main:run"